# Deploy FieldForge XR to GitHub Pages
#
# IWSDK starter docs explicitly allow this: "Built with IWSDK (WebXR): see
# Deploying to GitHub Pages for how to share a link. You may also use your
# preferred hosting solution (e.g. Vercel, Digital Ocean, AWS, Azure)."
#
# The build stays static — judges open a URL. The Python kernel runs here,
# at build time, and ships only verified JSON. The Vite config uses
# base:'./' so the bundle also works under a Pages subpath
# (https://<user>.github.io/<repo>/) without a hardcoded base.
#
# Triggers on both the default branch and the session branch so every push
# is live before the café needs it. Runs on ubuntu-latest; enable Pages with
# Source = GitHub Actions once, then it stays current automatically.
#
# Secrets: none. The app has no server-side API key (see
# web/src/ff/ai-config.ts and web/src/physics/extract.ts). The optional
# extractor proxy lives outside the bundle and is injected at runtime via
# VITE_FF_AI_PROXY — keep that variable empty for the competition build.

name: deploy

on:
  push:
    branches: [main, "arena/*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python kernel
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Audit knowledge base
        run: |
          python -m kernel.cli audit --coverage

      - name: Export verified physics bundle
        run: |
          python -m kernel.cli export
          echo "::notice ::Exported $(ls web/public/physics/specs/*.json | wc -l) specs"
          echo "::notice ::kb.json hash $(python -c "import json; print(json.load(open('web/public/physics/kb.json'))['contentHash'])")"

      - name: Verify no secrets in export
        run: |
          if grep -R -i "sk-" web/public/physics 2>/dev/null; then
            echo "::error ::physics bundle must not contain API keys"
            exit 1
          fi
          echo "physics bundle clean"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install JS deps
        working-directory: web
        run: npm ci

      - name: Typecheck + kernel cross-check (fails build on disagreement)
        working-directory: web
        run: |
          npm run typecheck
          npm run verify:kernel

      - name: Build static site
        working-directory: web
        run: npm run build
        env:
          # Leave empty for the competition build — see header comment.
          VITE_FF_AI_PROXY: ""

      - name: Verify bundle has no inlined secrets
        run: |
          if grep -R "VITE_FF_AI_PROXY" web/dist --include="*.js" | grep -i "sk-" ; then
            echo "::error ::bundle appears to contain an API key"
            exit 1
          fi
          # Vite must not have inlined a real proxy URL in the competition build.
          if grep -R "featherless" web/dist --include="*.js" | grep -v "proxy" ; then
            echo "::notice ::featherless reference in bundle — expected only as header hint"
          fi
          echo "bundle secret scan clean"
          ls -lh web/dist
          echo "physics bundle present: $(ls web/public/physics/kb.json 2>/dev/null && echo yes || echo no, expected copied via Vite publicDir)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
