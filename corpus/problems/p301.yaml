id: p301
title: Electric field inside a cavity carved from a charged sphere (JEE Advanced type)
source: "Problem type after the JEE Advanced 2015 cavity question (dataset: JEEBench, dair-iitd/jeebench); statement rewritten and values transposed, not reproduced."
tags: [electrostatics, superposition, cavity, jee-advanced, gauss]
text: |
  A solid insulating sphere of radius 12 cm carries a uniform volume charge density of
  2.0e-5 C/m^3. A spherical cavity is hollowed out inside it; the cavity's centre lies
  4.0 cm from the sphere's centre. Show that the field inside the cavity is uniform, and
  find its magnitude.
scene:
  instances:
    - id: cav
      kind: spherical_cavity_in_charged_sphere
      set:
        em.charge_density_volume: "2.0e-5 C/m^3"
        geometry.radius: "12 cm"
        geometry.offset: "[0.04, 0, 0] m"
target: {instance: cav, prop: em.electric_field_magnitude}
expect:
  value: 30117.6
  unit: V/m
  tol: 0.005
  note: >
    E = rho*a/(3*eps0) with rho = 2.0e-5 C/m^3 and offset a = 4.0 cm: uniform everywhere in
    the cavity and independent of the cavity's own radius -- the superposition result the
    JEE question is built around, derived here by the kernel rather than asserted.
