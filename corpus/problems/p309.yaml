id: p309
title: Two-node ladder network solved nodally (JEE Main type, Engine B)
source: "Kirchhoff-network problem type (JEE Main current-electricity style); network and values designed for this corpus, not reproduced from any paper."
tags: [circuits, ladder, system, engine-b, jee-main]
text: |
  A 24 V battery drives a ladder: 10 ohm from the top rail to node A, 20 ohm from A to
  the bottom rail, 10 ohm from A to node B, 30 ohm from the top rail to B, and 20 ohm
  from B to the bottom rail. What current flows through the rung between A and B?
scene:
  instances:
    - {id: bat, kind: battery, set: {electric.emf: "24 V"}}
    - {id: r1, kind: resistor, set: {electric.resistance: "10 ohm"}}
    - {id: r2, kind: resistor, set: {electric.resistance: "20 ohm"}}
    - {id: r3, kind: resistor, set: {electric.resistance: "10 ohm"}}
    - {id: r4, kind: resistor, set: {electric.resistance: "30 ohm"}}
    - {id: r5, kind: resistor, set: {electric.resistance: "20 ohm"}}
    - {id: top, kind: circuit_node}
    - {id: gnd, kind: circuit_node}
    - {id: node_a, kind: circuit_node}
    - {id: node_b, kind: circuit_node}
  relations:
    - {kind: positive_terminal, from: bat, to: top}
    - {kind: negative_terminal, from: bat, to: gnd}
    - {kind: terminal_a, from: r1, to: top}
    - {kind: terminal_b, from: r1, to: node_a}
    - {kind: terminal_a, from: r2, to: node_a}
    - {kind: terminal_b, from: r2, to: gnd}
    - {kind: terminal_a, from: r3, to: node_a}
    - {kind: terminal_b, from: r3, to: node_b}
    - {kind: terminal_a, from: r4, to: top}
    - {kind: terminal_b, from: r4, to: node_b}
    - {kind: terminal_a, from: r5, to: node_b}
    - {kind: terminal_b, from: r5, to: gnd}
target: {instance: r3, prop: electric.current}
expect:
  value: 0.223256
  unit: A
  tol: 0.001
  note: >
    KCL at both nodes: VA = 624/43 = 14.512 V, VB = 528/43 = 12.279 V, so the rung
    carries (VA - VB)/10 = 48/215 A = 0.2233 A from A to B. No reduction rule reaches a
    rung current; Engine B assembles and solves the nodal system.
