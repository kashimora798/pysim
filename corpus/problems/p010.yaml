id: p010
title: Total charge of a uniformly charged sphere
source: "After OpenStax University Physics 2, 6.4 (CC BY)"
tags: [electrostatics, geometry]
text: |
  An insulating sphere of radius 20 cm carries a uniform volume charge density of 5.0 uC/m^3.
  What is its total charge?
scene:
  instances:
    - id: ball
      kind: uniform_charged_sphere
      set:
        em.charge_density_volume: "5.0 uC/m^3"
        geometry.radius: "20 cm"
target: {instance: ball, prop: em.charge}
expect:
  value: 1.67552e-7
  unit: C
  tol: 0.005
  note: "Q = rho * (4/3)*pi*R^3 -- the resolver has to derive the volume as an intermediate step."
