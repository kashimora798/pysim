id: p202
title: Single loop in nodal form (engines cross-check)
source: "After OpenStax College Physics 2e, 20.2 (CC BY)"
tags: [circuits, system, engine-b, cross-check]
text: |
  The p101 loop -- 12 V across 4.0 ohm -- stated the nodal way: two circuit nodes and
  one branch. Engine B must reach the same 3 A the chain derives for p101.
scene:
  instances:
    - {id: bat, kind: battery, set: {electric.emf: "12 V"}}
    - {id: r1, kind: resistor, set: {electric.resistance: "4.0 ohm"}}
    - {id: top, kind: circuit_node}
    - {id: gnd, kind: circuit_node}
  relations:
    - {kind: positive_terminal, from: bat, to: top}
    - {kind: negative_terminal, from: bat, to: gnd}
    - {kind: terminal_a, from: r1, to: top}
    - {kind: terminal_b, from: r1, to: gnd}
target: {instance: r1, prop: electric.current}
expect: {value: 3.0, unit: A, tol: 0.001, note: "Same circuit as p101, assembled nodally."}
