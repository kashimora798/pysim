id: p308
title: Unbalanced bridge solved nodally (JEE Main type, Engine B)
source: "Kirchhoff-network problem type (JEE Main current-electricity style); network and values designed for this corpus, not reproduced from any paper."
tags: [circuits, bridge, system, engine-b, jee-main]
text: |
  A 12 V battery feeds a bridge network: from the top rail, 6.0 ohm leads to node A and
  4.0 ohm leads to node B; node A returns to the bottom rail through 12 ohm, node B
  through 12 ohm, and a 6.0 ohm bridge wire joins A to B. The bridge is deliberately
  unbalanced, so no series/parallel reduction can isolate the bridge current. What flows
  through the bridge wire, and in which direction?
scene:
  instances:
    - {id: bat, kind: battery, set: {electric.emf: "12 V"}}
    - {id: r1, kind: resistor, set: {electric.resistance: "6.0 ohm"}}
    - {id: r2, kind: resistor, set: {electric.resistance: "12 ohm"}}
    - {id: r3, kind: resistor, set: {electric.resistance: "4.0 ohm"}}
    - {id: r4, kind: resistor, set: {electric.resistance: "12 ohm"}}
    - {id: r5, kind: resistor, set: {electric.resistance: "6.0 ohm"}}
    - {id: top, kind: circuit_node}
    - {id: gnd, kind: circuit_node}
    - {id: mid_a, kind: circuit_node}
    - {id: mid_b, kind: circuit_node}
  relations:
    - {kind: positive_terminal, from: bat, to: top}
    - {kind: negative_terminal, from: bat, to: gnd}
    - {kind: terminal_a, from: r1, to: top}
    - {kind: terminal_b, from: r1, to: mid_a}
    - {kind: terminal_a, from: r2, to: mid_a}
    - {kind: terminal_b, from: r2, to: gnd}
    - {kind: terminal_a, from: r3, to: top}
    - {kind: terminal_b, from: r3, to: mid_b}
    - {kind: terminal_a, from: r4, to: mid_b}
    - {kind: terminal_b, from: r4, to: gnd}
    - {kind: terminal_a, from: r5, to: mid_a}
    - {kind: terminal_b, from: r5, to: mid_b}
target: {instance: r5, prop: electric.current}
expect:
  value: -0.0769231
  unit: A
  tol: 0.001
  note: >
    KCL at the two midpoints gives VA = 8.308 V and VB = 8.769 V, so the bridge current
    (VA - VB)/6 = -1/13 A: the minus sign means it actually flows from B to A, opposite
    to the terminal_a -> terminal_b direction the scene declares. Engine B only; the
    chain provably cannot reach it (asserted in tests/test_jee_corpus.py).
