id: p305
title: Alpha particle orbit after acceleration through 1 kV (JEE Advanced type)
source: "Problem type after the JEE Advanced alpha/sulfur ion-ratio question (dataset: JEEBench, dair-iitd/jeebench, gold ratio 4); statement rewritten, posed for one ion at a time, not reproduced."
tags: [magnetism, circular-motion, jee-advanced, cyclotron]
text: |
  An alpha particle (mass 4 u, charge +2e) starts from rest, is accelerated through a
  potential difference of 1000 V, and then enters a uniform magnetic field of 0.50 T
  directed perpendicular to its velocity. The accelerating voltage gives it a speed of
  3.1062e5 m/s. What is the radius of the circular orbit it follows in the field?
scene:
  instances:
    - id: region
      kind: uniform_magnetic_field_region
      set:
        em.magnetic_field: "[0, 0, 0.50] T"
    - id: ion
      kind: charged_particle
      set:
        em.charge: "3.204353268e-19 C"
        mechanics.mass: "6.6421562664e-27 kg"
        kinematics.velocity: "[310620.88, 0, 0] m/s"
  relations:
    - {kind: inside, from: ion, to: region}
simulate: {instance: ion, duration: 2.6048e-7, samples: 160}
target: {instance: ion, prop: em.cyclotron_radius}
expect:
  value: 0.0128774
  unit: m
  tol: 0.005
  note: >
    r = mv/(qB) with v = sqrt(2qV/m) from the 1 kV acceleration. Companion to p304: the
    sulfur ion's radius divided by this one is 4.0, the JEE gold ratio, because
    r scales as sqrt(m/q) at fixed accelerating voltage.
