[project]
name = "fieldforge"
version = "0.1.0"
description = "A component-based, deterministically-verified physics world. Problem in, lawful trace out."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }

# Licence stance: permissive dependencies only (BSD / MIT / Apache / PSF).
# No GPL or LGPL code is imported anywhere in the kernel. See docs/licences.md.
dependencies = [
    "sympy>=1.12",      # BSD-3-Clause  -- symbolic algebra, the kernel's backbone
    "pyyaml>=6.0",      # MIT           -- knowledge-base authoring format
    "typer>=0.12",      # MIT           -- CLI
    "rich>=13.0",       # MIT           -- trace / audit rendering
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",      # MIT
    "hypothesis>=6.0",  # MPL-2.0 (file-level copyleft, no linking obligation)
]

[project.scripts]
ff = "kernel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
